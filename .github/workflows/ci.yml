# CI/CD for the Applicant Screening API (Sprint 4).
#
#   pull request ──► lint ─┐
#                   test ──┼─► docker (build image, start it, smoke-test the real model)
#                          │
#   push to main ──────────┴─► docker ─► publish image to GHCR ─► deploy (optional hook + smoke test)
#
# Branch protection on main should require: lint, test (3.11), test (3.12), docker.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - name: ruff
        working-directory: serving
        run: ruff check . --output-format=github

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: serving/requirements*.txt
      # No torch: the API tests use the stand-in encoder, and the pipeline tests use the
      # committed MiniLM embeddings — so the whole suite runs in seconds.
      - run: pip install -r serving/requirements-dev.txt
      - name: Artifact bundle matches its manifest
        run: python serving/scripts/export_artifacts.py --check
      - name: pytest (API, monitoring, ML pipeline, deployment config)
        working-directory: serving
        run: pytest -q --junitxml=../test-results-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/applicant-screening-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (with the real MiniLM model baked in)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          load: true
          tags: screening-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 -e SCREENING_API_KEY=ci-key \
            --memory 2g screening-api:ci
      - name: Smoke test the running container
        run: |
          python serving/scripts/smoke_test.py --url http://localhost:8000 --api-key ci-key \
            --wait 180 --expect-model all-MiniLM-L6-v2
      - name: Container logs
        if: always()
        run: docker logs api | tail -n 100
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag screening-api:ci "$IMAGE_LC:${GITHUB_SHA::7}"
          docker tag screening-api:ci "$IMAGE_LC:latest"
          docker push "$IMAGE_LC:${GITHUB_SHA::7}"
          docker push "$IMAGE_LC:latest"

  deploy:
    # Render (autoDeployTrigger: checksPass) and Railway ("Wait for CI") deploy by
    # themselves once this workflow is green. This job covers everything else:
    #   secrets.DEPLOY_HOOK_URL   any deploy webhook (Render deploy hook, etc.) — optional
    #   vars.PRODUCTION_URL       base URL to smoke-test after the deploy — optional
    #   secrets.SCREENING_API_KEY the production API key — needed for the smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    env:
      HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
      URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy hook
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"
      - name: Smoke test production
        if: env.URL != ''
        run: |
          sleep 60
          python serving/scripts/smoke_test.py --url "$URL" --api-key "${{ secrets.SCREENING_API_KEY }}" --wait 600
      - name: Nothing configured
        if: env.HOOK == '' && env.URL == ''
        run: echo "No DEPLOY_HOOK_URL / PRODUCTION_URL set — the hosting platform deploys on its own."
