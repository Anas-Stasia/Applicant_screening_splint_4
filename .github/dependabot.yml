# Weekly dependency PRs; each one runs the full CI before anyone merges it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /serving
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /serving
    schedule: { interval: weekly }
