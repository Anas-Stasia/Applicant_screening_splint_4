<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screening API Demo</title>
<style>
  :root { --bg:#16140f; --panel:#1f1c16; --line:#3a352b; --ink:#ece6d8; --muted:#9a927f; --accent:#e0b04a; --ok:#7cc48a; --warn:#e0b04a; --bad:#e07a6a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin-bottom: 28px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  h2 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
  textarea, select, input { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: inherit; }
  textarea { min-height: 140px; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 160px; }
  .row > button { flex: 0 0 auto; }
  button { background: var(--accent); color: #1a1710; border: 0; border-radius: 6px; padding: 10px 16px; font-weight: 600; cursor: pointer; flex: 0 0 auto; }
  button:disabled { opacity: .5; cursor: wait; }
  .out { margin-top: 14px; }
  .bar { display: grid; grid-template-columns: 190px 1fr 56px; gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
  .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); }
  .num { text-align: right; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .low_confidence { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .err { color: var(--bad); font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  @media (max-width: 560px) { .bar { grid-template-columns: 110px 1fr 48px; } }
</style>
</head>
<body>
<main>
  <h1>Applicant Screening API</h1>
  <div class="sub">Reference UI for the Frontend squad · <a href="/docs" style="color:var(--accent)">/docs</a></div>

  <section>
    <h2>Match a resume to job categories — POST /v1/match</h2>
    <textarea id="resume" placeholder="Paste resume text or HTML…"></textarea>
    <div class="row"><button id="matchBtn">Match</button></div>
    <div class="out" id="matchOut"></div>
  </section>

  <section>
    <h2>Top resumes for a job — POST /v1/cohort/rank</h2>
    <div class="row">
      <select id="category"></select>
      <input id="topk" type="number" min="1" max="50" value="10" style="flex:0 0 90px">
      <button id="rankBtn">Rank</button>
    </div>
    <div class="out" id="rankOut"></div>
  </section>
</main>
<script>
  // Same-origin, so no CORS setup needed. From another origin (e.g. a Vite dev
  // server on :5173) add it to SCREENING_CORS_ORIGINS.
  async function api(method, path, body) {
    const res = await fetch(path, {
      method, headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error(data.error?.message ?? res.statusText), data.error);
    return { data, ms: res.headers.get("X-Process-Time-Ms"), rid: res.headers.get("X-Request-ID") };
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const showError = (el, e) => el.innerHTML = `<div class="err"><b>${esc(e.code ?? "ERROR")}</b> — ${esc(e.message)}</div>`;

  async function busy(btn, fn) { btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }

  matchBtn.onclick = () => busy(matchBtn, async () => {
    try {
      const { data, ms, rid } = await api("POST", "/v1/match", { text: resume.value, top_k: 5 });
      const r = data.result;
      matchOut.innerHTML =
        `<span class="pill ${r.status}">${r.status.replace("_", " ")}</span>` +
        r.top_matches.map((m) => `<div class="bar"><span>${esc(m.category)}</span>
          <div class="track"><div class="fill" style="width:${Math.max(0, m.similarity) * 100}%"></div></div>
          <span class="num">${m.similarity.toFixed(3)}</span></div>`).join("") +
        r.warnings.map((w) => `<div class="err" style="color:var(--warn)">${esc(w)}</div>`).join("") +
        `<div class="meta">${ms} ms · cached=${r.cached} · request ${rid}</div>`;
    } catch (e) { showError(matchOut, e); }
  });

  rankBtn.onclick = () => busy(rankBtn, async () => {
    try {
      const { data, ms } = await api("POST", "/v1/cohort/rank", { job: { category: category.value }, top_k: +topk.value });
      rankOut.innerHTML = `<table><tr><th>#</th><th>Resume ID</th><th>Labelled category</th><th>Similarity</th></tr>` +
        data.matches.map((m) => `<tr><td>${m.rank}</td><td>${esc(m.resume_id)}</td><td>${esc(m.category)}</td>
          <td class="num">${m.similarity.toFixed(3)}</td></tr>`).join("") +
        `</table><div class="meta">${ms} ms · ${data.cohort_size} resumes searched</div>`;
    } catch (e) { showError(rankOut, e); }
  });

  api("GET", "/v1/categories").then(({ data }) => {
    category.innerHTML = data.categories.map((c) => `<option>${esc(c)}</option>`).join("");
  }).catch((e) => showError(rankOut, e));
</script>
</body>
</html>
